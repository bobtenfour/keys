# DEMO / EVALUATION ONLY - KeyInventory on shared DigitalOcean Droplet SQL Server.
# Reuses existing dentalinventory-demo-sql via external network dentalinventory-demo_default.
# Database: KeyInventoryDemo only. Never DentalInventoryDemo / DentalInventoryDev.
# Does not define or modify the SQL Server container, /opt/Inv, or DentalInventory volumes.
# Normal up is NON-DESTRUCTIVE. Explicit KeyInventoryDemo drop is a separate operator script
# documented under RESET / RESEED DEMO in docker/README-demo.md (never in migrate/web startup; never wipe SQL volumes).
name: keyinventory-demo

services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: keyinventory-demo-migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__KeyInventory: Server=sqlserver,1433;Database=KeyInventoryDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;Encrypt=False
      DEMO_SQL_HOST: sqlserver
      DEMO_SQL_PORT: "1433"
      MIGRATE_MAX_ATTEMPTS: "30"
      MIGRATE_SLEEP_SECS: "2"
    networks:
      - dentalinventory-demo_default
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: keyinventory-demo-web
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${DEMO_HOST_PORT:-8081}:${PORT:-8080}"
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      PORT: ${PORT:-8080}
      ConnectionStrings__KeyInventory: Server=sqlserver,1433;Database=KeyInventoryDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;Encrypt=False
      LocalBootstrapAdmin__Enabled: ${LocalBootstrapAdmin__Enabled:-true}
      LocalBootstrapAdmin__UserName: ${LocalBootstrapAdmin__UserName:?LocalBootstrapAdmin__UserName is required}
      LocalBootstrapAdmin__Email: ${LocalBootstrapAdmin__Email:-user@demo.local}
      LocalBootstrapAdmin__Password: ${LocalBootstrapAdmin__Password:?LocalBootstrapAdmin__Password is required}
    networks:
      - dentalinventory-demo_default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS \"http://127.0.0.1:$${PORT:-8080}/health/ready\" >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 384m

networks:
  dentalinventory-demo_default:
    external: true
    name: dentalinventory-demo_default
